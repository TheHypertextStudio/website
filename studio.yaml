schema: 1
product: website
repository: TheHypertextStudio/website
owner_repository: TheHypertextStudio/website
toolchain:
  python: '>=3.11'
  node: '24.20.0'
  pnpm: '11.9.0'
  wrangler: '4.127.1'
components:
  - id: website
    kind: static-site
    path: .
    checks:
      - name: website
        argv: [pnpm, run, check]
    dev: [pnpm, run, dev]
    build:
      script: build:candidate
      output: build/site-candidate
    deploy:
      provider: workers
      account_id: '2500680a3b2b0fe6a011c1c25fed5008'
      config: wrangler.site.json
      entrypoint: worker.js
      assets: assets
      environments:
        staging: staging
        production: production
      health_urls:
        staging: https://staging.hypertext.studio/__studio/release
        production: https://hypertext.studio/__studio/release
release:
  channels: [direct]
  next_version: 0.1.0
  required_checks: [website]
  required_evidence:
    - staging-journeys
    - supporting-route-isolation
    - production-recovery
    - public-identity
