name: Set up repository
description: Install the pinned Node and pnpm toolchain and frozen dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        registry_config=$(mktemp "$RUNNER_TEMP/studio-registry.XXXXXX")
        trap 'rm -f "$registry_config"' EXIT
        chmod 600 "$registry_config"
        # Keep the placeholder literal; pnpm expands it from trusted user config.
        # shellcheck disable=SC2016
        printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$registry_config"
        export NPM_CONFIG_USERCONFIG="$registry_config"
        pnpm install --frozen-lockfile
