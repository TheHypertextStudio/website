version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
        update-types:
          - 'minor'
          - 'patch'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@playwright/*'
          - 'axe-playwright'
          - 'vitest'
          - 'lint-staged'
        update-types:
          - 'minor'
          - 'patch'
      types:
        patterns:
          - '@types/*'
    ignore:
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
