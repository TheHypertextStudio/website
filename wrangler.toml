# Hypertext Studio — Cloudflare Workers configuration.
# Each worker has its own [env.<name>] block; the top level is intentionally
# minimal so `wrangler dev <env>` and `wrangler deploy <env>` are unambiguous.
#
# Apply schema with: wrangler d1 migrations apply hypertext-studio --env webmention --remote

name = "hypertext-studio"
account_id = "2500680a3b2b0fe6a011c1c25fed5008"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# Default placeholder so plain `wrangler dev` errors clearly.
main = "workers/poem/index.ts"

# ----------------------------------------------------------------------------
# www — keep every legacy or typed www URL on the canonical apex origin.
# ----------------------------------------------------------------------------

[env.www]
name = "hypertext-studio-www"
main = "workers/www/index.ts"
routes = [
  { pattern = "www.hypertext.studio/*", zone_name = "hypertext.studio" }
]

[env.www.observability]
enabled = true

# ----------------------------------------------------------------------------
# poem — DNS TXT lookup for the footer's rotating quotation.
# Route:    GET https://hypertext.studio/api/poem
# ----------------------------------------------------------------------------

[env.poem]
name = "hypertext-studio-poem"
main = "workers/poem/index.ts"
routes = [
  { pattern = "hypertext.studio/api/poem*", zone_name = "hypertext.studio" }
]

[env.poem.observability]
enabled = true

# ----------------------------------------------------------------------------
# webmention — receive endpoint per W3C Webmention spec.
# Routes:   POST https://hypertext.studio/webmention   (receive)
#           GET  https://hypertext.studio/webmentions  (list, filtered by target)
# ----------------------------------------------------------------------------

[env.webmention]
name = "hypertext-studio-webmention"
main = "workers/webmention/index.ts"
routes = [
  { pattern = "hypertext.studio/webmention*", zone_name = "hypertext.studio" }
]

[[env.webmention.d1_databases]]
binding = "DB"
database_name = "hypertext-studio"
database_id = "b1ea6c3b-1315-4bbc-ac9b-5751c4253883"
migrations_dir = "migrations"

[env.webmention.observability]
enabled = true

# ----------------------------------------------------------------------------
# micropub — IndieAuth-protected publishing endpoint.
# Routes:   POST https://hypertext.studio/micropub   (create note)
#           GET  https://hypertext.studio/micropub   (capability discovery)
# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN         — fine-grained PAT with repository Contents set to
#                          Read and write
# ----------------------------------------------------------------------------

[env.micropub]
name = "hypertext-studio-micropub"
main = "workers/micropub/index.ts"
routes = [
  { pattern = "hypertext.studio/micropub*", zone_name = "hypertext.studio" }
]

[env.micropub.vars]
GITHUB_REPO = "TheHypertextStudio/website"
NOTES_PATH = "src/content/notes"
DEFAULT_BRANCH = "main"
INDIEAUTH_ENDPOINT = "https://tokens.indieauth.com/token"

[env.micropub.observability]
enabled = true

# ----------------------------------------------------------------------------
# oembed — return rich JSON payload for embed-aware platforms.
# Route:    GET https://hypertext.studio/oembed?url=...
# ----------------------------------------------------------------------------

[env.oembed]
name = "hypertext-studio-oembed"
main = "workers/oembed/index.ts"
routes = [
  { pattern = "hypertext.studio/oembed*", zone_name = "hypertext.studio" }
]

[env.oembed.vars]
SITE_URL = "https://hypertext.studio"
SITE_NAME = "Hypertext Studio"

[env.oembed.observability]
enabled = true
